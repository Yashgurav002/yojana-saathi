<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yojana Saathi · योजना साथी</title>
  <meta name="description" content="Speak in Marathi, Hindi or English and find the government schemes you are likely eligible for. A voice AI agent whose eligibility answers come from official rules, not guesses.">
  <meta name="theme-color" content="#0e6b5c">
  <meta property="og:title" content="Yojana Saathi · योजना साथी">
  <meta property="og:description" content="Talk in Marathi, Hindi or English. Find the government schemes meant for you. No login, no Aadhaar, no OTP.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <img src="icon.svg" alt="" width="38" height="38">
      <span><b>Yojana Saathi</b><small>योजना साथी</small></span>
    </a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="mr" lang="mr">मराठी</button>
      <button type="button" data-lang="hi" lang="hi">हिंदी</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <button type="button" id="restart" class="icon-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
      <span data-t="restart"></span>
    </button>
  </header>

  <main class="layout">
    <section class="chat" aria-label="Conversation">
      <div id="welcome" class="welcome">
        <h1 data-t="tagline"></h1>
        <p class="sub" data-t="sub"></p>
        <ul class="promises">
          <li data-t="p1"></li><li data-t="p2"></li><li data-t="p3"></li>
        </ul>
        <p class="try" data-t="tryLabel"></p>
        <div id="examples" class="examples"></div>
      </div>
      <ol id="log" class="log" aria-live="polite"></ol>

      <div class="dock">
        <div id="profile" class="profile" hidden>
          <span class="profile-label" data-t="understood"></span>
          <div id="chips" class="chips"></div>
        </div>
        <button type="button" id="jump" class="jump" hidden></button>
        <form id="composer" class="composer" autocomplete="off">
          <button type="button" id="mic" class="mic">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          </button>
          <input id="input" name="message" maxlength="500" enterkeyhint="send">
          <button type="submit" id="send" class="send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          </button>
        </form>
        <p id="hint" class="hint" role="status"></p>
      </div>
    </section>

    <aside id="results" class="results" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title" data-t="resultsTitle"></h2>
        <button type="button" id="share-all" class="wa" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"/><path d="M8.8 8.6c.3 2.9 2.7 5.4 5.6 5.8l1.3-1.3 1.8.9c-.2 1.3-1.2 2-2.4 2A7.3 7.3 0 0 1 7.6 8.6c0-1.2.7-2.2 2-2.4l.9 1.8z" class="fill"/></svg>
          <span data-t="shareAll"></span>
        </button>
      </div>
      <div id="groups"></div>
    </aside>
  </main>

  <footer class="foot">
    <p data-t="disclaimer"></p>
    <p class="credits"><span data-t="credits"></span> <a href="https://github.com/Yashgurav002/yojana-saathi" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
</body>
</html>
